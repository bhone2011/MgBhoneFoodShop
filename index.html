<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mg Bhone Food Shop</title>
    <link rel="stylesheet" href="style.css">
    <h1>Mg Bhone Food Shop</h1>
</head>
<body>
  <div class="sign">
    <h2>Sign Up</h2>
    <form action="Food.html" method="get">
      <input type="text" id="username" name="username" placeholder="Username" required><br><br>
      
      <input type="email" id="email" name="email" placeholder="Email" required><br><br>
      
      <input type="password" id="password" name="password" placeholder="Password" minlength="4" maxlength="12" required><br><br>

      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" minlength="4" maxlength="12" checked required><br><br>
      
      <input class="id" type="submit" value="Sign Up">
      <input class="id" type="reset" value="Reset">
    </form>
  </div>
  <footer>
    <p>&copy; 2026 Mg Bhone Food. All rights reserved.</p>
</body>   
</html>
